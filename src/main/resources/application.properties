spring.application.name=CampusGigs
server.port=8080

# O schema é controlado pelo Flyway — o Hibernate não cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Fallback quando o Postgres já estiver no ar (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/campusgigs
spring.datasource.username=campusgigs
spring.datasource.password=campusgigs

# Sobe o Postgres automaticamente junto com a aplicação
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=true

# JWT (HS256). A chave precisa ter pelo menos 32 caracteres.
app.jwt.secret=CampusGigsJwtSecretKeyQuePrecisaTerPeloMenos32Bytes!
app.jwt.expiration-ms=86400000

spring.http.serviceclient.viacep.base-url=https://viacep.com.br
