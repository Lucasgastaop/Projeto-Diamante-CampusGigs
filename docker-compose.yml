services:
  postgres:
    image: postgres:16-alpine
    container_name: campusgigs-postgres
    environment:
      POSTGRES_DB: campusgigs
      POSTGRES_USER: campusgigs
      POSTGRES_PASSWORD: campusgigs
    ports:
      - "5432:5432"
    volumes:
      - campusgigs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgigs -d campusgigs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusgigs-data:
